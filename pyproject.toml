[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-workers-rabbitmq"
version = "0.1.0a1"
description = "Durable RabbitMQ queue adapter for Orbit Workers."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["aio-pika>=9,<10", "orbit-workers>=0.1.0a1,<0.2", "pydantic>=2.9,<3"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]
core = ["orbit-core>=0.1.0a1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_workers_rabbitmq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_workers_rabbitmq"]
